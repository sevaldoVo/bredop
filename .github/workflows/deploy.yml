# ============================================================================
# ВИЛКА — CI/CD: пуш в master => деплой на VPS по SSH.
#
# GitHub Secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST         IP/домен сервера
#   VPS_USER         ssh-пользователь (например, deploy)
#   VPS_SSH_KEY      приватный SSH-ключ (pem/openssh), для которого публичная
#                    часть лежит в ~/.ssh/authorized_keys на сервере
#   VPS_PATH         путь к клону репозитория на сервере (~/vilka)
#
# Опционально (для отката при падении healthcheck):
#   не требуется — rollback встроен в шаги ниже.
# ============================================================================
name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------- подготовка SSH ----------
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config <<EOF
          Host vilka-vps
            HostName ${{ secrets.VPS_HOST }}
            User ${{ secrets.VPS_USER }}
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking yes
          EOF

      # ---------- деплой ----------
      - name: Pull latest code on server
        run: |
          ssh vilka-vps "cd '${{ secrets.VPS_PATH }}' && \
            git fetch --all && \
            git reset --hard origin/master"

      - name: Run DB migrations / schema init
        run: |
          # SQLAlchemy create_all идемпотентен; alembic подключается, когда появятся миграции.
          ssh vilka-vps "cd '${{ secrets.VPS_PATH }}' && \
            docker compose -f docker-compose.prod.yml exec -T backend \
            python -c 'import asyncio, models_sql; asyncio.run(models_sql.init_db())' || true"

      - name: Rebuild & restart containers
        run: |
          ssh vilka-vps "cd '${{ secrets.VPS_PATH }}' && \
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans"

      # ---------- verification + auto-rollback ----------
      - name: Health check
        id: health
        run: |
          ok=0
          for i in $(seq 1 12); do
            if ssh vilka-vps "curl -fsS http://localhost/api/health -k -H 'Host: vilka.app' || curl -fsSk https://vilka.app/api/health"; then
              ok=1; break
            fi
            echo "attempt $i failed, waiting..."; sleep 5
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          [ "$ok" = "1" ]

      - name: Rollback on failure
        if: failure() && steps.health.outcome == 'failure'
        run: |
          echo "::warning::Deploy unhealthy — redeploying previous image set"
          ssh vilka-vps "cd '${{ secrets.VPS_PATH }}' && \
            git checkout HEAD~1 -- . 2>/dev/null; \
            docker compose -f docker-compose.prod.yml up -d || true"

      - name: Cleanup SSH artifacts
        if: always()
        run: rm -rf ~/.ssh
