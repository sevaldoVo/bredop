services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vilka-backend
    ports:
      - "8000:8000"
    environment:
      VILKA_CORS_ORIGINS: ${VILKA_CORS_ORIGINS:-http://localhost:5173}
      VILKA_PROXIES: ${VILKA_PROXIES:-}
      VILKA_TG_API_URL: ${VILKA_TG_API_URL:-}
      VILKA_TG_API_KEY: ${VILKA_TG_API_KEY:-}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_SESSION_NAME: /app/sessions/vilka
      VILKA_SPIDER_DELAY: ${VILKA_SPIDER_DELAY:-1.5}
      VILKA_SPIDER_MAX_NODES: ${VILKA_SPIDER_MAX_NODES:-50}
      # Auth: поддерживаем оба имени флага (код читает VILKA_AUTH_ENFORCED, доки исторически — AUTH_ENFORCED)
      VILKA_AUTH_ENFORCED: ${VILKA_AUTH_ENFORCED:-${AUTH_ENFORCED:-0}}
      AUTH_ENFORCED: ${VILKA_AUTH_ENFORCED:-${AUTH_ENFORCED:-0}}
      # JWT-секрет: без него токены умирают после рестарта контейнера
      VILKA_JWT_SECRET: ${VILKA_JWT_SECRET:-}
      # Первый админ (создаётся/переписывается при старте; пусто или change-me* = не трогаем)
      VILKA_ADMIN_EMAIL: ${VILKA_ADMIN_EMAIL:-}
      VILKA_ADMIN_PASSWORD: ${VILKA_ADMIN_PASSWORD:-}
      VILKA_ADMIN_CREDITS: ${VILKA_ADMIN_CREDITS:-100000}
    volumes:
      - ./data/breaches:/app/data/breaches
      - ./sessions:/app/sessions
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: vilka-web
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
