# ============================================================================
# ВИЛКА — production reverse proxy (Nginx)
# Разворачивается контейнером из docker-compose.prod.yml.
#   vilka.app:443 (TLS от certbot) --> frontend  (vilka-web:80 внутри сети)
#   /api, /ws, /health --> backend   (vilka-backend:8000)
# HTTP (80) редиректится на HTTPS; /.well-known/acme-challenge остаётся
# открытым для продления сертификатов Let's Encrypt.
# ============================================================================

# gzip ------------------------------------------------------------------
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript
           application/xml image/svg+xml text/xml application/x-www-form-urlencoded;

# WebSocket upgrade map ---------------------------------------------------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream vilka_backend {
    server vilka-backend:8000;
    keepalive 32;
}

upstream vilka_frontend {
    server vilka-web:80;        # nginx-раздача Vite-билда внутри контейнера web
    keepalive 16;
}

# --- HTTP: ACME + редирект на HTTPS -------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name vilka.app www.vilka.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ---------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vilka.app www.vilka.app;

    # Пути генерирует certbot-контейнер (см. docker-compose.prod.yml)
    ssl_certificate     /etc/letsencrypt/live/vilka.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vilka.app/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ---------------- security headers ----------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' wss://vilka.app https://vilka.app;" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    server_tokens off;

    client_max_body_size 25m;   # base64 картинок для reverse image search

    # ---------------- API + WebSocket -> backend ----------------
    location /api/ {
        proxy_pass http://vilka_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;          # enrich/spider могут думать
        proxy_send_timeout 120s;
    }

    # WS-эндпоинты (/ws/enrich и стримы спайдера)
    location /ws/ {
        proxy_pass http://vilka_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;         # длинные стрим-сессии спайдера
        proxy_send_timeout 3600s;
    }

    location = /api/health {
        proxy_pass http://vilka_backend;
        access_log off;
    }

    # ---------------- SPA -> frontend ----------------
    location / {
        proxy_pass http://vilka_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
